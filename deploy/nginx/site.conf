# /etc/nginx/conf.d/site.conf
# 官网前台（site-web） + 管理后台（site-admin） + 后端反代
# 修改：域名、证书路径、静态目录、后端地址

upstream site_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- 官网前台 ----------
server {
    listen 80;
    server_name www.example.com example.com;

    # HTTPS 就绪后取消下一行注释，并启用 443 段
    # return 301 https://$host$request_uri;

    root /data/www/site-web/dist;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存（vite 产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端接口
    location /api/ {
        proxy_pass http://site_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 上传文件（Nginx 直接回源后端；接 OSS 后改为跳转/CDN）
    location /profile/ {
        proxy_pass http://site_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------- 管理后台（建议独立子域 + 来源 IP 白名单） ----------
server {
    listen 80;
    server_name admin.example.com;

    root /data/www/site-admin/dist;
    index index.html;
    client_max_body_size 20m;

    # 可选：仅允许办公网访问
    # allow 203.0.113.10;
    # deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后台接口：前端 VUE_APP_BASE_API=/prod-api
    location /prod-api/ {
        proxy_pass http://site_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 后台图片预览
    location /profile/ {
        proxy_pass http://site_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # 禁止生产暴露接口文档与控制台（后端已关闭，这里再兜一层）
    location ~ ^/(swagger-ui|v3/api-docs|druid) {
        return 404;
    }
}

